<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}

.url{position:absolute;left:80px;bottom:36px;font-size:18px;letter-spacing:.12em;color:#b4c5d8;border-top:1px solid rgba(180,197,216,.3);padding-top:14px;width:1040px}
